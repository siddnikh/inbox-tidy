name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-app.ts"
      - "scripts/lib.ts"
      - "scripts/smoke-test-app.ts"
      - "shell/**"
      - "package.json"
      - "bun.lock"

permissions:
  contents: write

jobs:
  build:
    name: Build and test (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple-Silicon
          - runner: macos-15-intel
            arch: x64
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run typecheck && bun test tests/unit
      - name: Build Inbox Tidy.app
        run: bun scripts/build-app.ts --arch ${{ matrix.arch }} --out dist/${{ matrix.arch }}
      - name: Check the app starts and answers on this Mac
        run: bun scripts/smoke-test-app.ts "dist/${{ matrix.arch }}/Inbox Tidy.app"
      - name: Zip
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          ZIP="Inbox-Tidy-${VERSION}-macOS-${{ matrix.label }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.arch }}/Inbox Tidy.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: Inbox-Tidy-*.zip*

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Check the tag matches the app version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat *.sha256 > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" Inbox-Tidy-*.zip SHA256SUMS.txt \
            --title "Inbox Tidy ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
