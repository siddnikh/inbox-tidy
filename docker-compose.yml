# Local fake mail server for tests and QA. Never point QA at a real mailbox.
services:
  mail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=qa:qa-password@inbox-tidy.test,friend:friend-password@inbox-tidy.test
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose=false
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
      - "127.0.0.1:8080:8080"
